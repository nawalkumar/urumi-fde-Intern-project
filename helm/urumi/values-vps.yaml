# NOT A PRODUCTION CONFIGURATION.
# Helm can render this file. That does not mean it is safe to install.
# Copy it to helm/urumi/values-vps.local.yaml, which is gitignored, and
# replace every placeholder there. Do not commit that copy. Do not put
# passwords, API keys, or certificate material in either file.
#
# Still required from the operator, because this checkout does not have them:
# - A registry and tag for urumi-gateway, urumi-dashboard, and the three MCP images.
# - DNS names for the store, gateway, and dashboard. store.publicUrl must be https:// plus the store host.
# - A TLS Secret of type kubernetes.io/tls. This chart does not create the certificate.
# - The ingress class and the controller namespace. k3s Traefik uses class traefik and namespace kube-system. Another cluster may use nginx and ingress-nginx.
# - A StorageClass name that exists on that cluster. Empty uses the cluster default.
# - networkPolicy.probeCIDRs set to that node's InternalIP after the node exists. The inherited default is empty, so an enforcing CNI would block kubelet probes.
# - Existing Secrets, created with kubectl, named by the fields below:
#   database: POSTGRES_PASSWORD and GATEWAY_DATABASE_URL
#   store: MARIADB_ROOT_PASSWORD, MARIADB_PASSWORD, WORDPRESS_DB_PASSWORD (same as MARIADB_PASSWORD), WORDPRESS_ADMIN_USER, WORDPRESS_ADMIN_PASSWORD, WORDPRESS_ADMIN_EMAIL
#   gateway.upstreamKeySecret: GATEWAY_UPSTREAM_KEY
#   gateway.chatApiSecret: CHAT_API_KEY, and optionally CHAT_API_URL and CHAT_MODEL
#   woocommerce.existingSecret: WOOCOMMERCE_CONSUMER_KEY and WOOCOMMERCE_CONSUMER_SECRET
# Public mariadb:11.4, wordpress:6.8-php8.2-apache, wordpress:cli-php8.2, and postgres:16-alpine are the chart defaults. Resource numbers are unmeasured.

imagePullPolicy: IfNotPresent

# Not install-ready. replace-me is not an ingress-controller namespace.
# k3s Traefik uses kube-system. An nginx controller often uses ingress-nginx.
networkPolicy:
  ingressNamespace: replace-me

gateway:
  cookieSecure: true
  upstreamKeySecret: replace-me
  chatApiSecret: replace-me
  image:
    repository: replace-me/urumi-gateway
    tag: replace-me
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

upstreams:
  support:
    image:
      repository: replace-me/urumi-support-mcp
      tag: replace-me
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  utility:
    image:
      repository: replace-me/urumi-utility-mcp
      tag: replace-me
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  woocommerce:
    image:
      repository: replace-me/urumi-woocommerce-mcp
      tag: replace-me
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

store:
  publicUrl: https://store.replace-me.invalid
  existingSecret: replace-me
  mariadb:
    image:
      repository: mariadb
      tag: "11.4"
    persistence:
      size: 2Gi
      storageClass: replace-me
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
  wordpress:
    image:
      repository: wordpress
      tag: 6.8-php8.2-apache
    persistence:
      size: 2Gi
      storageClass: replace-me
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
  init:
    image:
      repository: wordpress
      tag: cli-php8.2

woocommerce:
  existingSecret: replace-me

dashboard:
  image:
    repository: replace-me/urumi-dashboard
    tag: replace-me

ingress:
  enabled: true
  className: nginx
  tls:
    - secretName: replace-me-tls
      hosts:
        - store.replace-me.invalid
        - gateway.replace-me.invalid
        - dashboard.replace-me.invalid
  store:
    enabled: true
    host: store.replace-me.invalid
  gateway:
    enabled: true
    host: gateway.replace-me.invalid
  dashboard:
    enabled: true
    host: dashboard.replace-me.invalid

database:
  existingSecret: replace-me
  image:
    repository: postgres
    tag: 16-alpine
  persistence:
    size: 1Gi
    storageClass: replace-me
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
