{{- if and .Values.store.enabled (not .Values.store.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "urumi.storeSecretName" . }}
  labels:
    {{- include "urumi.componentLabels" (list . "store") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.store.secretKeys.mariadbRootPassword }}: {{ .Values.store.mariadb.rootPassword | quote }}
  {{ .Values.store.secretKeys.mariadbPassword }}: {{ .Values.store.mariadb.password | quote }}
  {{ .Values.store.secretKeys.wordpressDbPassword }}: {{ .Values.store.mariadb.password | quote }}
  {{ .Values.store.secretKeys.adminUser }}: {{ .Values.store.wordpress.adminUser | quote }}
  {{ .Values.store.secretKeys.adminPassword }}: {{ .Values.store.wordpress.adminPassword | quote }}
  {{ .Values.store.secretKeys.adminEmail }}: {{ .Values.store.wordpress.adminEmail | quote }}
{{- end }}
