{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "urumi.serviceName" (list . "dashboard") }}
  labels:
    {{- include "urumi.componentLabels" (list . "dashboard") | nindent 4 }}
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      {{- include "urumi.selectorLabels" (list . "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "urumi.componentLabels" (list . "dashboard") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/dashboard-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "urumi.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "urumi.image" .Values.dashboard.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.containerPort }}
              protocol: TCP
          startupProbe:
            {{- include "urumi.httpProbe" .Values.probes.dashboard.startup | nindent 12 }}
          livenessProbe:
            {{- include "urumi.httpProbe" .Values.probes.dashboard.liveness | nindent 12 }}
          readinessProbe:
            {{- include "urumi.httpProbe" .Values.probes.dashboard.readiness | nindent 12 }}
          {{- with .Values.dashboard.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "urumi.resources" .Values.dashboard.resources | nindent 10 }}
          volumeMounts:
            - name: nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx
          configMap:
            name: {{ include "urumi.serviceName" (list . "dashboard-config") }}
{{- end }}
