{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "urumi.serviceName" (list . "dashboard-config") }}
  labels:
    {{- include "urumi.componentLabels" (list . "dashboard") | nindent 4 }}
data:
  default.conf: |
    server {
      listen {{ .Values.dashboard.containerPort }};
      server_name _;
      root /usr/share/nginx/html;
      # The browser calls the dashboard host. Nginx forwards /admin to the gateway
      # Service. The session cookie stays on the dashboard host.
      location /admin/ {
        proxy_pass http://{{ include "urumi.serviceName" (list . "gateway") }}:{{ .Values.service.mcpPort }};
        proxy_http_version 1.1;
        proxy_set_header Host {{ `$host` }};
        proxy_set_header X-Forwarded-For {{ `$proxy_add_x_forwarded_for` }};
        proxy_set_header X-Forwarded-Proto {{ `$scheme` }};
      }
      location = /admin {
        return 301 /admin/;
      }
      location / {
        try_files {{ `$uri` }} {{ `$uri/` }} /index.html;
      }
    }
{{- end }}
