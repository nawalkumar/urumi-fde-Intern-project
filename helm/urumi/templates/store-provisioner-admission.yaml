{{- if and .Values.storeProvisioner.enabled .Values.storeProvisioner.admit }}
# Standard RBAC cannot restrict a ClusterRole to namespaces named st-<id>.
# This policy is the separate boundary. It applies only to the provisioner
# service account. failurePolicy Fail denies the write when the policy cannot
# be evaluated. GET and LIST are not admission requests; secret reads are
# limited by resourceNames on the ClusterRole instead.
# This manifest was not enforced on a live cluster. Leave both flags false
# on the cluster that holds unrelated Secrets.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "urumi.serviceName" (list . "store-provisioner-scope") }}
  labels:
    {{- include "urumi.componentLabels" (list . "store-provisioner") | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces", "secrets", "configmaps", "services", "persistentvolumeclaims", "serviceaccounts", "resourcequotas", "limitranges"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["deployments", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["jobs"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies", "ingresses"]
  matchConditions:
    - name: provisioner-service-account
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" .Release.Namespace (include "urumi.serviceName" (list . "store-provisioner")) | quote }}
  validations:
    - expression: >-
        request.namespace == ''
        ? (
          (has(object.metadata.name) ? object.metadata.name : request.name).matches('^st-[0-9a-f]{16}$')
          && (
            request.operation == 'DELETE'
            ? (
              has(oldObject.metadata.labels)
              && ('st-' + string(oldObject.metadata.labels['urumi.dev/store-id'])) == request.name
            )
            : (
              has(object.metadata.labels)
              && ('st-' + string(object.metadata.labels['urumi.dev/store-id'])) == object.metadata.name
            )
          )
        )
        : (
          request.namespace.matches('^st-[0-9a-f]{16}$')
          && (
            request.operation == 'DELETE'
            || (
              has(object.metadata.labels)
              && ('st-' + string(object.metadata.labels['urumi.dev/store-id'])) == request.namespace
            )
          )
          && (
            request.resource.resource != 'secrets'
            || request.name in ['store-db', 'woocommerce-credentials']
            || (
              has(object.metadata.name)
              && object.metadata.name in ['store-db', 'woocommerce-credentials']
            )
          )
        )
      message: Provisioner changes are limited to an owned store namespace.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "urumi.serviceName" (list . "store-provisioner-scope") }}
  labels:
    {{- include "urumi.componentLabels" (list . "store-provisioner") | nindent 4 }}
spec:
  policyName: {{ include "urumi.serviceName" (list . "store-provisioner-scope") }}
  validationActions: [Deny]
{{- end }}
