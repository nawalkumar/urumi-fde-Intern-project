{{- if not .Values.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "urumi.databaseSecretName" . }}
  labels:
    {{- include "urumi.componentLabels" (list . "gateway-db") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.secretKeys.password }}: {{ .Values.database.password | quote }}
  {{ .Values.database.secretKeys.conninfo }}: {{ include "urumi.databaseConninfo" . | quote }}
{{- end }}
