apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi.databaseHost" . }}
  labels:
    {{- include "urumi.componentLabels" (list . "gateway-db") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "urumi.selectorLabels" (list . "gateway-db") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.database.port }}
      targetPort: postgres
      protocol: TCP
