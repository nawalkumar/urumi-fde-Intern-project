{{- if .Values.store.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "urumi.serviceName" (list . "wordpress") }}
  labels:
    {{- include "urumi.componentLabels" (list . "wordpress") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "urumi.selectorLabels" (list . "wordpress") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.store.wordpress.port }}
      targetPort: http
      protocol: TCP
{{- end }}
