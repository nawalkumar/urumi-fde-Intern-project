{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "urumi.serviceName" (list . "ingress") }}
  labels:
    {{- include "urumi.componentLabels" (list . "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.store.enabled }}
    - host: {{ .Values.ingress.store.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.serviceName" (list . "wordpress") }}
                port:
                  number: {{ .Values.store.wordpress.port }}
    {{- end }}
    {{- if .Values.ingress.gateway.enabled }}
    - host: {{ .Values.ingress.gateway.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.serviceName" (list . "gateway") }}
                port:
                  number: {{ .Values.service.mcpPort }}
    {{- end }}
    {{- if .Values.ingress.dashboard.enabled }}
    - host: {{ .Values.ingress.dashboard.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "urumi.serviceName" (list . "dashboard") }}
                port:
                  number: {{ .Values.dashboard.port }}
    {{- end }}
{{- end }}
