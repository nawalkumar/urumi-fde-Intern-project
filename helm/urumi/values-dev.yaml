# Local rendering overlay. These sizes are provisional guesses for a laptop
# or a future local cluster. They are not a measured capacity plan.
# Images are expected only after a local docker build and a load into the node.
# The gateway tag below is not the image running on kind-urumi-k8s-dev.
# On 2026-10-19 that Deployment was set with kubectl to urumi-gateway:grants-msg-20261019.
# The dashboard tag still matches urumi-dashboard:module5-20261018.
# The MCP servers still use k8s-test, which is the image those Deployments run.
# Do not helm upgrade this file. It would put the gateway back on chat-20261018
# and set networkPolicy.probeCIDRs to 172.19.0.3/32. Live policies allow 172.19.0.2/32.
# Ingress is rendered for store.local. This file does not install a controller.

imagePullPolicy: IfNotPresent

gateway:
  image:
    repository: urumi-gateway
    tag: chat-20261018
  upstreamKeySecret: urumi-dev-gateway-keys
  chatApiSecret: urumi-dev-chat
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

upstreams:
  support:
    image:
      tag: k8s-test
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  utility:
    image:
      tag: k8s-test
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  woocommerce:
    image:
      tag: k8s-test
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

store:
  publicUrl: http://store.local
  existingSecret: urumi-dev-store-credentials
  mariadb:
    persistence:
      size: 2Gi
      storageClass: ""
  wordpress:
    persistence:
      size: 2Gi
      storageClass: ""

woocommerce:
  existingSecret: urumi-dev-woocommerce-credentials

dashboard:
  image:
    repository: urumi-dashboard
    tag: module5-20261018

networkPolicy:
  # Not a verified kubelet probe source. On 2026-10-19 kind-urumi-k8s-dev
  # was 172.19.0.2 and kind-urumi-k8s-test was 172.19.0.3. Live policies
  # allow 172.19.0.2/32. This value stays 172.19.0.3/32. On 2026-10-15
  # the dev node was 172.19.0.3. Do not apply this file to change the live CIDR.
  probeCIDRs:
    - 172.19.0.3/32

ingress:
  enabled: true
  className: nginx
  store:
    enabled: true
    host: store.local
  gateway:
    enabled: true
    host: gateway.local
  dashboard:
    enabled: true
    host: dashboard.local

database:
  existingSecret: urumi-dev-gateway-credentials
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
