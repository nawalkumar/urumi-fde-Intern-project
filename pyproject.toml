[project]
name = "urumi"
version = "0.1.0"
description = "MCP gateway that aggregates WooCommerce, Support Notes, and Utility servers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115.0",
    "mcp==2.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "uvicorn>=0.31.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::mcp.shared.exceptions.MCPDeprecationWarning",
]
