name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.0"
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Pull disposable PostgreSQL image
        run: |
          docker info >/dev/null
          if ! docker pull postgres:16-alpine; then
            docker pull public.ecr.aws/docker/library/postgres:16-alpine
            docker tag public.ecr.aws/docker/library/postgres:16-alpine postgres:16-alpine
          fi

      - name: Run gateway tests
        run: uv run pytest

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run dashboard tests
        run: npm test

      - name: Build dashboard
        run: npm run build
